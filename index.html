<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ece'ye Özel ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d0d0d;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ARKA PLAN VE OVERLAY */
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://i.ibb.co/YGCTwxZ/MG-5816.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.35);
            transform: scale(1.08);
            z-index: 1;
        }

        /* ORTAK EKRAN YAPISI */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .screen {
            position: absolute;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: opacity 1s ease, transform 1s ease;
        }

        /* 1. EKRAN (YÜKLEME) */
        #screen1 {
            opacity: 1;
            z-index: 3;
        }

        .quote-intro {
            font-size: 1.15rem;
            font-weight: 300;
            font-style: italic;
            line-height: 1.8;
            color: #f1f1f1;
            margin-bottom: 35px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .loader-bar {
            width: 180px;
            height: 3px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        .loader-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            animation: load 6s linear forwards;
        }

        @keyframes load {
            to { width: 100%; }
        }

        /* 2. EKRAN (KART VE SPOTIFY) */
        #screen2 {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            z-index: 2;
            display: none;
        }

        .card {
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 25px 20px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-bottom: 18px;
        }

        .main-quote {
            font-size: 0.98rem;
            font-weight: 300;
            line-height: 1.6;
            color: #e5e5e5;
            margin-bottom: 22px;
        }

        /* SPOTIFY EMBED */
        .spotify-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        iframe {
            border: none;
            width: 100%;
            height: 80px;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="container">
        <!-- 1. EKRAN: ETKİLEYİCİ GİRİŞ -->
        <div id="screen1" class="screen">
            <p class="quote-intro">“Gülüşün diyorum Ece… Öyle rastgele bir güzellik değil, insanın ömrüne ömür, aklına ziyan katan cinsten…”</p>
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
        </div>

        <!-- 2. EKRAN: FOTOĞRAF, SÖZ VE SPOTIFY -->
        <div id="screen2" class="screen">
            <div class="card">
                <img src="https://i.ibb.co/6RSH2tSt/MG-5815.jpg" alt="Ece" class="profile-img">
                <p class="main-quote">“Dünyanın en kalabalık yerinde bile gözlerim hep seni arıyor. İyi ki kesişti yollarımız, iyi ki varsın güzelim…”</p>
                
                <div class="spotify-wrapper">
                    <iframe src="https://open.spotify.com/embed/track/5Ftku2ydxC3nkYHlkZU5Tx?utm_source=generator&theme=0" width="100%" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');

        // 6 saniye sonra 1. ekrandan 2. ekrana ipeksi geçiş
        setTimeout(() => {
            screen1.style.opacity = '0';
            screen1.style.transform = 'translateY(-20px)';
            
            setTimeout(() => {
                screen1.style.display = 'none';
                screen2.style.display = 'flex';
                
                setTimeout(() => {
                    screen2.style.opacity = '1';
                    screen2.style.transform = 'translateY(0)';
                    screen2.style.pointerEvents = 'auto';
                }, 50);
            }, 1000);
        }, 6000);
    </script>
</body>
</html>
